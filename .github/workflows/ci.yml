name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test local installer without root
        run: bash .dev/install_test.sh

      - name: Build
        run: go build -o hostup ./src

      - name: Build Linux ARM64 and AMD64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          GOARCH=arm64 go build -o bin/hostup-linux-arm64 ./src
          GOARCH=amd64 go build -o bin/hostup-linux-amd64 ./src
