version: "3"

silent: true

vars:
  BINARY: hostup
  BUILD_DIR: bin
  MODULE: github.com/ih0r-d/hostup
  VM_NAME: hostup-sandbox
  VM_UBUNTU: "24.04"
  VM_CPUS: "2"
  VM_MEMORY: 2G
  VM_DISK: 10G
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Format, tidy, validate and build locally
    cmds:
      - task: fmt
      - task: tidy
      - task: check
      - task: build

  dev:install:
    desc: Install Hostup development command
    cmds:
      - task: build
      - mkdir -p "$HOME/.local/bin"
      - ln -sfn "{{.ROOT_DIR}}/{{.BUILD_DIR}}/{{.BINARY}}" "$HOME/.local/bin/{{.BINARY}}"
      - echo "Hostup installed at $HOME/.local/bin/{{.BINARY}}"
      - echo "Ensure $HOME/.local/bin is in your PATH"

  dev:uninstall:
    desc: Remove Hostup development command
    cmds:
      - |
        LINK="$HOME/.local/bin/{{.BINARY}}"
        TARGET="{{.ROOT_DIR}}/{{.BUILD_DIR}}/{{.BINARY}}"
        if [ -L "$LINK" ] && [ "$(readlink "$LINK")" = "$TARGET" ]; then
          rm "$LINK"
          echo "Hostup development command removed"
        else
          echo "No matching Hostup development symlink found"
        fi

  ci:
    desc: Run full verification pipeline
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: test:race
      - task: build:linux

  run:
    desc: Run Hostup locally
    cmds:
      - go run ./cmd/hostup {{.CLI_ARGS}}

  build:
    desc: Build for current platform
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}
        ./cmd/hostup

  build:linux:
    desc: Build Linux ARM64 and AMD64 binaries
    cmds:
      - task: build:arm64
      - task: build:amd64

  build:arm64:
    internal: true
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-arm64
        ./cmd/hostup

  build:amd64:
    internal: true
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-amd64
        ./cmd/hostup

  check:
    internal: true
    cmds:
      - task: fmt:check
      - task: vet
      - task: test

  fmt:
    internal: true
    cmds:
      - go fmt ./...

  fmt:check:
    internal: true
    cmds:
      - sh -c 'test -z "$(gofmt -l cmd internal)"'

  tidy:
    internal: true
    cmds:
      - go mod tidy

  vet:
    internal: true
    cmds:
      - go vet ./...

  test:
    internal: true
    cmds:
      - go test ./...

  test:race:
    internal: true
    cmds:
      - go test -race ./...

  vm:check:
    internal: true
    preconditions:
      - sh: command -v multipass >/dev/null 2>&1
        msg: Install Multipass before running VM tasks.
      - sh: command -v jq >/dev/null 2>&1
        msg: Install jq to parse Multipass JSON output.

  vm:up:
    desc: Create or start the Ubuntu integration VM
    cmds:
      - task: vm:check
      - bash "{{.ROOT_DIR}}/scripts/vm/lifecycle.sh" up "{{.VM_NAME}}" "{{.VM_UBUNTU}}" "{{.VM_CPUS}}" "{{.VM_MEMORY}}" "{{.VM_DISK}}"

  vm:down:
    desc: Stop the integration VM without deleting it
    cmds:
      - task: vm:check
      - bash "{{.ROOT_DIR}}/scripts/vm/lifecycle.sh" down "{{.VM_NAME}}"

  vm:status:
    desc: Show integration VM status and information
    cmds:
      - task: vm:check
      - multipass info "{{.VM_NAME}}"

  vm:shell:
    desc: Open an interactive Ubuntu shell in the integration VM
    interactive: true
    cmds:
      - task: vm:up
      - multipass shell "{{.VM_NAME}}"

  vm:deploy:
    desc: Build and transfer the latest Linux ARM64 binary to the VM
    cmds:
      - task: vm:up
      - task: build:arm64
      - multipass transfer "{{.ROOT_DIR}}/{{.BUILD_DIR}}/{{.BINARY}}-linux-arm64" "{{.VM_NAME}}:/home/ubuntu/{{.BINARY}}"
      - multipass exec "{{.VM_NAME}}" -- chmod +x "/home/ubuntu/{{.BINARY}}"

  vm:test:
    desc: Deploy and run read-only Linux smoke tests in the VM
    cmds:
      - task: vm:deploy
      - multipass exec "{{.VM_NAME}}" -- "/home/ubuntu/{{.BINARY}}" version
      - multipass exec "{{.VM_NAME}}" -- "/home/ubuntu/{{.BINARY}}" info
      - multipass exec "{{.VM_NAME}}" -- "/home/ubuntu/{{.BINARY}}" doctor
      - multipass exec "{{.VM_NAME}}" -- "/home/ubuntu/{{.BINARY}}" service list
      - multipass exec "{{.VM_NAME}}" -- "/home/ubuntu/{{.BINARY}}" service status systemd-journald
      - multipass exec "{{.VM_NAME}}" -- "/home/ubuntu/{{.BINARY}}" service logs systemd-journald --lines 20

  vm:test:integration:
    desc: Test service operations against a disposable systemd unit
    cmds:
      - task: vm:deploy
      - bash "{{.ROOT_DIR}}/scripts/vm/integration.sh" "{{.VM_NAME}}" "/home/ubuntu/{{.BINARY}}"

  vm:install:
    desc: Install the local Linux build at /usr/local/bin/hostup in the VM
    cmds:
      - task: vm:deploy
      - bash "{{.ROOT_DIR}}/scripts/vm/installation.sh" install "{{.VM_NAME}}" "/home/ubuntu/{{.BINARY}}"

  vm:test:install:
    desc: Install and verify the sandbox binary and CLI
    cmds:
      - task: vm:install
      - bash "{{.ROOT_DIR}}/scripts/vm/installation.sh" verify "{{.VM_NAME}}" "/home/ubuntu/{{.BINARY}}" "{{.VERSION}}"

  vm:uninstall:
    desc: Remove only the VM binary owned by the development installer
    cmds:
      - task: vm:check
      - bash "{{.ROOT_DIR}}/scripts/vm/installation.sh" uninstall "{{.VM_NAME}}" "/home/ubuntu/{{.BINARY}}"

  vm:delete:
    desc: Permanently delete only the integration VM (asks for confirmation)
    prompt: "Permanently delete VM '{{.VM_NAME}}' and all its data?"
    cmds:
      - task: vm:check
      - multipass delete --purge "{{.VM_NAME}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
