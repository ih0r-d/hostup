version: "3"

silent: true

vars:
  DEFAULT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

# The root defines workflows; .dev/ contains their implementation.
includes:
  go:
    taskfile: ./.dev/Taskfile.go.yml
    flatten: true
  dev: ./.dev/Taskfile.local.yml
  vm: ./.dev/Taskfile.vm.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Format, tidy, validate and build locally
    cmds:
      - task: fmt
      - task: tidy
      - task: check
      - task: build

  ci:
    desc: Run full verification pipeline
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: test:race
      - task: build:linux
