version: '3'

vars:
  BINARY: hostup
  BUILD_DIR: bin

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build Hostup
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.BINARY}} ./cmd/hostup

  run:
    desc: Run Hostup
    cmds:
      - go run ./cmd/hostup

  test:
    desc: Run tests
    cmds:
      - go test ./...

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  check:
    desc: Run verification
    cmds:
      - task: fmt
      - task: vet
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
