version: "3"

vars:
  BINARY: hostup
  BUILD_DIR: bin
  MODULE: github.com/ih0r-d/hostup
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Format, tidy, validate and build locally
    cmds:
      - task: fmt
      - task: tidy
      - task: check
      - task: build

  dev:install:
    desc: Install Hostup development command
    cmds:
      - task: build
      - mkdir -p "$HOME/.local/bin"
      - ln -sfn "{{.ROOT_DIR}}/{{.BUILD_DIR}}/{{.BINARY}}" "$HOME/.local/bin/{{.BINARY}}"
      - echo "Hostup installed at $HOME/.local/bin/{{.BINARY}}"
      - echo "Ensure $HOME/.local/bin is in your PATH"

  dev:uninstall:
    desc: Remove Hostup development command
    cmds:
      - |
        LINK="$HOME/.local/bin/{{.BINARY}}"
        TARGET="{{.ROOT_DIR}}/{{.BUILD_DIR}}/{{.BINARY}}"
        if [ -L "$LINK" ] && [ "$(readlink "$LINK")" = "$TARGET" ]; then
          rm "$LINK"
          echo "Hostup development command removed"
        else
          echo "No matching Hostup development symlink found"
        fi

  ci:
    desc: Run full verification pipeline
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: test:race
      - task: build:linux

  run:
    desc: Run Hostup locally
    cmds:
      - go run ./cmd/hostup {{.CLI_ARGS}}

  build:
    desc: Build for current platform
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}
        ./cmd/hostup

  build:linux:
    desc: Build Linux ARM64 and AMD64 binaries
    cmds:
      - task: build:arm64
      - task: build:amd64

  build:arm64:
    internal: true
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-arm64
        ./cmd/hostup

  build:amd64:
    internal: true
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-amd64
        ./cmd/hostup

  check:
    internal: true
    cmds:
      - task: fmt:check
      - task: vet
      - task: test

  fmt:
    internal: true
    cmds:
      - go fmt ./...

  fmt:check:
    internal: true
    cmds:
      - sh -c 'test -z "$(gofmt -l cmd internal)"'

  tidy:
    internal: true
    cmds:
      - go mod tidy

  vet:
    internal: true
    cmds:
      - go vet ./...

  test:
    internal: true
    cmds:
      - go test ./...

  test:race:
    internal: true
    cmds:
      - go test -race ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
