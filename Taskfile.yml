version: "3"

vars:
  BINARY: hostup
  BUILD_DIR: bin
  MODULE: github.com/ih0r-d/hostup
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build for the current platform
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}
        ./cmd/hostup

  build:linux:
    desc: Build for Linux ARM64 and AMD64
    cmds:
      - task: build:arm64
      - task: build:amd64

  build:arm64:
    desc: Build for Linux ARM64 (Raspberry Pi)
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-arm64
        ./cmd/hostup

  build:amd64:
    desc: Build for Linux AMD64
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-amd64
        ./cmd/hostup

  run:
    desc: Run Hostup locally
    cmds:
      - go run ./cmd/hostup {{.CLI_ARGS}}

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  fmt:check:
    desc: Verify Go formatting
    cmds:
      - sh -c 'test -z "$(gofmt -l cmd internal)"'

  vet:
    desc: Run static analysis
    cmds:
      - go vet ./...

  check:
    desc: Run all verification steps
    cmds:
      - task: fmt:check
      - task: vet
      - task: test

  tidy:
    desc: Tidy Go dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
