version: "3"

silent: true

# Retain caller overrides when Task flattens inherited variables onto tasks.
vars:
  BINARY: '{{.BINARY | default "hostup"}}'
  BUILD_DIR: '{{.BUILD_DIR | default "bin"}}'
  MODULE: '{{.MODULE | default "github.com/ih0r-d/hostup"}}'
  VERSION: '{{.VERSION | default .DEFAULT_VERSION}}'

# Flattened into the root to preserve task build/run and verification names.
tasks:
  run:
    desc: Run Hostup locally
    cmds:
      - go run ./src {{.CLI_ARGS}}

  build:
    desc: Build for current platform
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/src/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}
        ./src

  build:linux:
    desc: Build Linux ARM64 and AMD64 binaries
    cmds:
      - task: build:arm64
      - task: build:amd64

  build:arm64:
    internal: true
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/src/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-arm64
        ./src

  build:amd64:
    internal: true
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        go build
        -ldflags "-X {{.MODULE}}/src/internal/cli.version={{.VERSION}}"
        -o {{.BUILD_DIR}}/{{.BINARY}}-linux-amd64
        ./src

  check:
    internal: true
    cmds:
      - task: fmt:check
      - task: vet
      - task: test

  fmt:
    internal: true
    cmds:
      - go fmt ./...

  fmt:check:
    internal: true
    cmds:
      - sh -c 'test -z "$(gofmt -l src)"'

  tidy:
    internal: true
    cmds:
      - go mod tidy

  vet:
    internal: true
    cmds:
      - go vet ./...

  test:
    internal: true
    cmds:
      - go test ./...
      - bash .dev/install_test.sh

  test:race:
    internal: true
    cmds:
      - go test -race ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
